# Wrangler configuration for Cloudflare Worker
# NOTE: This is configured for a Worker (not Pages). The [site] table was
# removed because Workers don't use site buckets.

# account_id is intentionally left empty so CI can provide CF_ACCOUNT_ID via secrets
account_id = ""
name = "abvdata"
main = "dist/worker.js"
compatibility_date = "2026-07-10"
type = "javascript"

# Enable workers_dev for preview deployments (uncomment to use the workers.dev preview URL)
workers_dev = true

# Example: To deploy to a custom domain, add routes and zone_id in an env:
# [env.production]
# account_id = "your_account_id_here"
# zone_id = "your_zone_id_here"
# route = "example.com/*"
#
# To add KV namespaces:
# [[kv_namespaces]]
# binding = "MY_KV"
# id = "your_kv_namespace_id_here"
#
# Add any additional publish settings below, e.g. routes, env vars, or build settings.
